<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sepet — Altansedir</title><meta name="description" content="Sepetiniz ve sipariş formu.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css"></head><body><div id="hdr"></div>
<div class="pagehead"><div class="wrap"><div class="crumbs">Ana Sayfa / Sepet</div><h1 style="font-size:clamp(40px,6vw,72px)">Sepetim</h1></div></div><section style="padding-top:30px"><div class="wrap" id="root"></div></section>
<div id="ftr"></div><script src="assets/app.js"></script><script>
document.addEventListener('DOMContentLoaded',()=>{
 const root=$('#root');let step='cart';
 const acc=store.get('ts_account',{});
 function cartView(){const c=getCart();
  if(!c.length){root.innerHTML='<div style="text-align:center;padding:50px 0"><h2 style="margin-bottom:14px">Sepetiniz boş</h2><p style="color:var(--mut);margin-bottom:24px">Beğendiğiniz modeli ölçü ve renk seçerek sepete ekleyin.</p><a class="btn fill" href="sedir-modelleri.html">Modelleri Keşfet</a></div>';return}
  const total=c.reduce((a,i)=>a+i.price*i.qty,0);
  root.innerHTML=`<div class="cwrap"><div>${c.map((i,n)=>`<div class="cartrow"><a class="im" href="urun.html?id=${i.id}" style="background-image:url(assets/img/${i.photo})"></a><div><b class="serif" style="font-size:22px">${i.name}</b><small>${i.summary}</small><div class="qty" style="margin-top:10px"><button data-a="m" data-n="${n}">−</button><span>${i.qty}</span><button data-a="p" data-n="${n}">+</button></div></div><div style="text-align:right"><b>${money(i.price*i.qty)}</b><br><button class="note" data-a="d" data-n="${n}" style="background:none;border:0;text-decoration:underline;cursor:pointer;margin-top:8px">Kaldır</button></div></div>`).join('')}</div>
  <div class="sum"><h3>Sipariş özeti</h3><div class="row"><span>Ara toplam</span><span>${money(total)}</span></div><div class="row"><span>Kargo / nakliye</span><span>Adrese göre netleşir</span></div><div class="row" style="border-top:1px solid var(--line);margin-top:8px;padding-top:14px"><span>Toplam (tahmini)</span><span class="tot">${money(total)}</span></div><p class="note" style="margin:10px 0 18px">Özel ölçü ürünlerde fiyat, ölçü onayından sonra kesinleşir.</p><button class="btn fill" id="go" style="width:100%">Siparişe Devam Et</button></div></div>`}
 function formView(){const c=getCart(),total=c.reduce((a,i)=>a+i.price*i.qty,0);
  root.innerHTML=`<div class="cwrap"><form class="form" id="of"><h3>Teslimat ve iletişim bilgileri</h3><div class="row2"><div><label>Ad Soyad</label><input name="ad" required value="${acc.ad||''}"></div><div><label>Telefon</label><input name="tel" type="tel" required value="${acc.tel||''}"></div></div><label>E-posta</label><input name="mail" type="email" value="${acc.mail||''}"><div class="row2"><div><label>İl</label><input name="il" required value="${acc.il||''}"></div><div><label>İlçe</label><input name="ilce" required value="${acc.ilce||''}"></div></div><label>Açık adres</label><textarea name="adres" required>${acc.adres||''}</textarea>
  <label>Ödeme yöntemi</label><div class="opts"><label class="check" style="text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)"><input type="radio" name="odeme" value="Havale / EFT" checked> Havale / EFT</label><label class="check" style="text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)"><input type="radio" name="odeme" value="Kredi kartı (ödeme linki)"> Kredi kartı (ödeme linki ile)</label></div><label>Sipariş notu</label><textarea name="not" placeholder="Ölçü, renk veya teslimat ile ilgili notunuz"></textarea>
  <label class="check" style="text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);margin-top:18px"><input type="checkbox" required> <span><a href="yasal.html#mesafeli" target="_blank" style="text-decoration:underline">Mesafeli satış sözleşmesini</a>, <a href="yasal.html#kvkk" target="_blank" style="text-decoration:underline">KVKK aydınlatma metnini</a> okudum, özel ölçü ürünlerde cayma hakkı olmadığını kabul ediyorum.</span></label><p style="margin-top:20px"><button class="btn wa">Siparişi Tamamla</button> <button type="button" class="btn" id="back" style="margin-left:8px">Geri</button></p></form>
  <div class="sum"><h3>Sipariş özeti</h3>${c.map(i=>`<div class="row"><span>${i.name} × ${i.qty}</span><span>${money(i.price*i.qty)}</span></div>`).join('')}<div class="row" style="border-top:1px solid var(--line);margin-top:8px;padding-top:14px"><span>Toplam (tahmini)</span><span class="tot">${money(total)}</span></div></div></div>`;
  $('#back').onclick=()=>{step='cart';render()};
  $('#of').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const no='TS-'+Date.now().toString().slice(-6);
   const order={no,date:new Date().toLocaleString('tr-TR'),items:c,total,...d};const o=store.get('ts_orders',[]);o.unshift(order);store.set('ts_orders',o);store.set('ts_account',{...acc,ad:d.ad,tel:d.tel,mail:d.mail,il:d.il,ilce:d.ilce,adres:d.adres});
   let m=`*Yeni Sipariş ${no}*\n`+c.map(i=>`• ${i.name} x${i.qty}\n  ${i.summary}\n  ${money(i.price*i.qty)}`).join('\n')+`\n\n*Toplam (tahmini):* ${money(total)}\n*Ödeme:* ${d.odeme}\n\n*Müşteri:* ${d.ad}\n*Tel:* ${d.tel}\n*Adres:* ${d.adres}, ${d.ilce}/${d.il}`+(d.not?`\n*Not:* ${d.not}`:'');
   store.set('ts_cart',[]);badge();
   root.innerHTML=`<div class="ok"><h2 style="text-transform:none">Siparişiniz alındı</h2><p style="margin:10px 0">Sipariş numaranız: <b>${no}</b></p><p>Siparişinizi WhatsApp üzerinden bize iletmeniz gerekiyor; açılan pencerede <b>Gönder</b>'e basın. Ekibimiz ölçü ve fiyatı onaylayıp ödeme bilgilerini paylaşır.</p><p style="margin-top:18px"><a class="btn wa" href="https://wa.me/${WA}?text=${encodeURIComponent(m)}" target="_blank">WhatsApp ile Gönder</a> <a class="btn" style="margin-left:8px" href="hesabim.html#siparis">Siparişlerim</a></p></div>`;
   window.open(`https://wa.me/${WA}?text=${encodeURIComponent(m)}`,'_blank')}}
 function render(){step==='cart'?cartView():formView();if(step==='cart'&&$('#go'))$('#go').onclick=()=>{step='form';render();scrollTo(0,0)}}
 root.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const c=getCart(),n=+b.dataset.n;if(b.dataset.a==='p')c[n].qty++;if(b.dataset.a==='m')c[n].qty=Math.max(1,c[n].qty-1);if(b.dataset.a==='d')c.splice(n,1);store.set('ts_cart',c);badge();render()});
 render()});
</script></body></html>
